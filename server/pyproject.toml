[project]
name = "order-desk-agent"
version = "0.1.0"
description = "Order desk agent for Demo Distributor: verifies customer POs against sales orders and ERP terms."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
